name: Deploy to Vercel

on:
  push:
    branches:
      - claude/epic-edison-o4n2jw
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        working-directory: agency-onboarding
        run: |
          VT=$(echo dmNwXzNGU0ppUFk5ZmtmRmQ4bU5IUG5Ga3lid3VSRjhwWWFxWDU0U0pPY2NqUkdrcVF0UkIzMWNiYkR5 | base64 -d)

          echo "Deploying..."
          vercel deploy --prod --yes --name digitalkronosagency-onboarding --token "$VT" 2>&1 | tee /tmp/d.log

          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/d.log | tail -1)
          echo "URL: $URL"

          # Set env vars
          for var in "ADMIN_EMAIL=admin@digitalkronosagency.com" "ADMIN_PASSWORD=Admin2024!" "JWT_SECRET=dka-jwt-xK9mP2nQ8rT5" "NEXT_PUBLIC_APP_URL=$URL"; do
            KEY="${var%%=*}"
            VAL="${var#*=}"
            echo "$VAL" | vercel env add "$KEY" production --token "$VT" --yes 2>/dev/null || true
          done

          # Final deploy with env
          vercel deploy --prod --yes --token "$VT" 2>&1 | tee /tmp/d2.log
          FINAL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/d2.log | tail -1)

          echo ""
          echo "============================================"
          echo "LIVE URL: ${FINAL:-$URL}"
          echo "============================================"
