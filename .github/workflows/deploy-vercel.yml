name: Deploy to Vercel

on:
  push:
    branches:
      - claude/epic-edison-o4n2jw
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: agency-onboarding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prod --yes \
            --name digitalkronosagency-onboarding \
            --token "${VERCEL_TOKEN}" 2>&1 | tee /tmp/deploy.log
          echo "=== DEPLOYMENT URL ==="
          grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/deploy.log | tail -1 || grep 'https://' /tmp/deploy.log | tail -3

      - name: Set environment variables
        working-directory: agency-onboarding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROJECT_ID=$(cat .vercel/project.json | grep -o '"projectId":"[^"]*"' | cut -d'"' -f4 2>/dev/null || echo "")
          if [ -n "$PROJECT_ID" ]; then
            DEPLOYMENT_URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/deploy.log | tail -1)
            vercel env add ADMIN_EMAIL production --token "${VERCEL_TOKEN}" <<< "admin@digitalkronosagency.com" 2>/dev/null || true
            vercel env add ADMIN_PASSWORD production --token "${VERCEL_TOKEN}" <<< "Admin2024!" 2>/dev/null || true
            vercel env add JWT_SECRET production --token "${VERCEL_TOKEN}" <<< "dka-prod-secret-$(date +%s)" 2>/dev/null || true
            vercel env add NEXT_PUBLIC_APP_URL production --token "${VERCEL_TOKEN}" <<< "${DEPLOYMENT_URL}" 2>/dev/null || true
            echo "Env vars set. Redeploying..."
            vercel deploy --prod --yes --token "${VERCEL_TOKEN}" 2>&1 | tail -5
          fi
