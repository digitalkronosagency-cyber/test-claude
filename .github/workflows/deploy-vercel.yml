name: Deploy to Vercel

on:
  push:
    branches:
      - claude/epic-edison-o4n2jw
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: agency-onboarding
        run: |
          vercel deploy --prod --yes \
            --env ADMIN_EMAIL="admin@digitalkronosagency.com" \
            --env ADMIN_PASSWORD="Admin2024!" \
            --env JWT_SECRET="digitalkronosagency-prod-secret-$(openssl rand -hex 16)" \
            --env NEXT_PUBLIC_APP_URL="https://digitalkronosagency.vercel.app" \
            --env RESEND_API_KEY="" \
            --env NEXT_PUBLIC_SUPABASE_URL="" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="" \
            --env SUPABASE_SERVICE_ROLE_KEY="" \
            --name digitalkronosagency-onboarding \
            --token $VERCEL_TOKEN 2>&1 | tee /tmp/vercel-output.txt
          # Extract and display the deployment URL
          grep -E 'https://.*vercel.app' /tmp/vercel-output.txt || true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
